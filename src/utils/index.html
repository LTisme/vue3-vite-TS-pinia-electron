<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入口文件是index.html</title>
</head>

<body>
    <div id="app"></div>
</body>
<script type="module">
    import { effect, MyReactive } from './MyReactive.js'

    const user = MyReactive({ name: '张三', age: 18 })
    effect(() => {
        document.querySelector('#app').innerText = `姓名：${user.name} 年龄：${user.age}`
    })

    setTimeout(() => {
        user.name = '李四'
    }, 2000)
</script>

</html>
